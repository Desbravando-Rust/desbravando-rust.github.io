# Dados da página /tools/crustdb/ — edite aqui a cada release.
# version vazio = estado pré-release (CTA "Acompanhe no GitHub").
repo: "https://github.com/Desbravando-Rust/crustdb"
version: "0.1.0-rc5"            # ex: "0.1.0" (sem o "v"; a tag é v{{version}})
release_date: "2026-11-01"       # ex: "2026-11-10"
release_notes_url: ""  # vazio = linka {{repo}}/releases
checksums_url: ""      # SHA256SUMS da release (vazio = oculto)
# file = URL completa do asset na release. desc = texto curto do bloco Linux em /tools/crustdb/#download.
downloads:
  - label: "AppImage"
    desc: "Qualquer distro. Marque como executável e rode."
    arch: "x86_64"
    file: "https://github.com/Desbravando-Rust/cRustDB/releases/download/v0.1.0-rc5/crustdb-0.1.0-rc5-x86_64.AppImage"
    primary: true
  - label: "tar.gz"
    desc: "Binário para descompactar onde quiser."
    arch: "x86_64"
    file: "https://github.com/Desbravando-Rust/cRustDB/releases/download/v0.1.0-rc5/crustdb-0.1.0-rc5-x86_64-linux.tar.gz"
    primary: false
  - label: ".deb"
    desc: "Debian, Ubuntu e derivados."
    arch: "x86_64"
    file: "https://github.com/Desbravando-Rust/cRustDB/releases/download/v0.1.0-rc5/crustdb-0.1.0-rc5-x86_64.deb"
    primary: false
  - label: ".rpm"
    desc: "Fedora, RHEL e openSUSE."
    arch: "x86_64"
    file: "https://github.com/Desbravando-Rust/cRustDB/releases/download/v0.1.0-rc5/crustdb-0.1.0-rc5-x86_64.rpm"
    primary: false
  - label: "Flatpak"
    desc: "Em sandbox. Instale com flatpak install --user."
